apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qr-code-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/darisadam/devops-qr-code.git' # UPDATE THIS if repo URL differs
    targetRevision: HEAD
    path: k8s/helm/api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qr-code-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/darisadam/devops-qr-code.git' # UPDATE THIS if repo URL differs
    targetRevision: HEAD
    path: k8s/helm/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
