name: Build and Publish image to Docker Hub

on:
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build image
        run: |
          docker build ./api/ -t darisadam/qr-code-api:latest
          docker build ./front-end-nextjs/ -t darisadam/qr-code-frontend:latest
      - name: push image to dockerhub
        run: |
          docker login -u darisadam -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker push darisadam/qr-code-api:latest
          docker push darisadam/qr-code-frontend:latest